<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Checklists{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <main class="max-w-2xl mx-auto p-6">
        <header class="mb-6">
            <p class="text-xs font-semibold uppercase tracking-wider text-gray-500">{% block goal %}{% endblock %}</p>
            <h1 class="text-4xl font-bold text-gray-900 mt-1">{% block target %}{% endblock %}</h1>
            <p class="text-sm text-gray-500 mt-1">{% block info %}{% endblock %}</p>
        </header>

        {% block content %}{% endblock %}

        <div class="w-full flex justify-evenly items-center my-6">
            {% block menu %}{% endblock %}
        </div>
    </main>
</body>
</html>
