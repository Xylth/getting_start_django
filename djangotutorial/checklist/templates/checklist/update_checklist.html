<h1>Renommer une checklist</h1>
<p>{{form.initial.name}}</p>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="submit" value="Valider">
</form>

<form method="get" action="{% url 'checklist:checklist_detail' checklist.id %}">
    <button type="submit">Retour</button>
</form>
