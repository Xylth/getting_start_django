<div style="max-height:320px; overflow-y:auto; border:1px solid var(--border-color); border-radius:4px; display:inline-block;">
  <table style="margin:0; min-width:300px;">
    <thead>
      <tr>
        <th>Username</th>
        <th>Authorisation</th>
      </tr>
    </thead>
    <tbody>
      {% for group_name, group_choices, group_index in widget.optgroups %}
        {% for option in group_choices %}
          <tr>
            <td><label for="{{ option.attrs.id }}">{{ option.label }}</label></td>
            <td style="text-align:center;">
              <input type="checkbox" name="{{ option.name }}"
                     value="{{ option.value|stringformat:'s' }}"
                     id="{{ option.attrs.id }}"
                     {% if option.selected %}checked{% endif %}>
            </td>
          </tr>
        {% endfor %}
      {% endfor %}
    </tbody>
  </table>
</div>
